name: Run Calculator Tests

on:
  push:
    paths:
      - 'test_calc.py'
      - 'calc.py'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install --upgrade pip

    - name: Run tests
      run: python test_calc.py
